services:
  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_URL: http://api:8000
    ports:
      - "127.0.0.1:${FLOWBRIDGE_FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowbridge}:${POSTGRES_PASSWORD:-flowbridge}@postgres:5432/${POSTGRES_DB:-flowbridge}
      REDIS_URL: redis://redis:6379/0
      FLOWBRIDGE_SECRET_KEY: ${FLOWBRIDGE_SECRET_KEY:-local-dev-only-change-this-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:${FLOWBRIDGE_API_PORT:-8000}/api/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FLOWBRIDGE_FRONTEND_PORT:-5173}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FLOWBRIDGE_RUN_TIMEOUT_SECONDS: ${FLOWBRIDGE_RUN_TIMEOUT_SECONDS:-3600}
    ports:
      - "127.0.0.1:${FLOWBRIDGE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowbridge}:${POSTGRES_PASSWORD:-flowbridge}@postgres:5432/${POSTGRES_DB:-flowbridge}
      REDIS_URL: redis://redis:6379/0
      FLOWBRIDGE_SECRET_KEY: ${FLOWBRIDGE_SECRET_KEY:-local-dev-only-change-this-secret}
      FLOWBRIDGE_RUN_TIMEOUT_SECONDS: ${FLOWBRIDGE_RUN_TIMEOUT_SECONDS:-3600}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowbridge}
      POSTGRES_DB: ${POSTGRES_DB:-flowbridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
